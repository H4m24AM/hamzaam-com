name: Collection build checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_photography_hover.cjs
      - run: python scripts/build_collections.py
      - uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: dist
          retention-days: 7
